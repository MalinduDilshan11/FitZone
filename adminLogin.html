<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/adminLogin.css" />
    <script src="js/adminLogin.js" defer></script>
    <title>Admin Login</title>
</head>

<body>
    <div class="container">
        <h1 class="form-title">Admin Login</h1>
        <form id="login-form" action="adminLogin.php" method="POST">
            <div class="main-user-info">
                <div class="user-input-box">
                    <label for="name">Username</label>
                    <input type="name" id="name" name="name" placeholder="Enter User Name" required />
                    <span class="error-message" id="email-error"></span>
                </div>
                <div class="user-input-box">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Password" required />
                    <span class="error-message" id="password-error"></span>
                </div>
                <div class="form-submit-btn">
                    <input type="submit" value="Admin Login">
                </div>
                <div class="success-message" id="success-message"></div>
                <div class="error-message" id="general-error"></div>
            </div>
        </form>
    </div>
</body>

</html>
