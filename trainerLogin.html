<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/trainerLogin.css" />
    <script src="js/trainerLogin.js" defer></script>
    <title>Trainer Login</title>
</head>

<body>
    <div class="container">
        <h1 class="form-title">Trainer Login</h1>
        <form id="login-form" action="trainerLogin.php" method="POST">
            <div class="main-user-info">
                <div class="user-input-box">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter Email" required />
                    <span class="error-message" id="email-error"></span>
                </div>
                <div class="user-input-box">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Password" required />
                    <span class="error-message" id="password-error"></span>
                </div>
                <div class="form-submit-btn">
                    <input type="submit" value="Trainer Login">
                </div>
                <div class="success-message" id="success-message"></div>
                <div class="error-message" id="general-error"></div>
            </div>
        </form>
    </div>
</body>

</html>
