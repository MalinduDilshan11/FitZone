<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/viewUser.css">
    <title>View Users</title>
</head>

<body>
    <div class="container">
        <h1 class="page-title">Registered Users</h1>
        <div class="user-table">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>NIC</th>
                        <th>Email</th>
                        <th>Phone Number</th>
                        <th>Gender</th>
                    </tr>
                </thead>
                <tbody id="user-data">
                    <!-- User data will be injected here by viewUser.js -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/viewUser.js"></script>
</body>

</html>
